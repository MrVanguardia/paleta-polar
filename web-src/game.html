<title>Paleta Polar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: landscape handheld — left thumb zone (HUD + floating joystick) · board · right thumb zone (HUD + ice button). Portrait falls back to board on top. Single deliberate night-ice look. */
:root{
  --bg:#0a1430;
  --bg2:#132558;
  --panel:#18306a;
  --ice:#9fe8ff;
  --text:#eef8ff;
  --muted:#8fa8d4;
  --pink:#ff5c8d;
  --gold:#ffd34d;
  --font-d:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --font-b:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  --bone:#eeeae0;
  --ink:#141414;
  --ink2:#55524b;
  --line:rgba(20,20,20,.16);
  --accent:#ff4f7b;
  --night:#0a1430;
  --f-disp:'Anton','Impact','Arial Narrow',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --f-ser:'Instrument Serif',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:radial-gradient(90% 120% at 50% 50%,var(--bg2),var(--bg) 75%) var(--bg);
  color:var(--text);font-family:var(--font-b);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}
#app{
  height:100%;display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"left stage right";gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px;position:relative;
}
body.port #app{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;grid-template-areas:"stage stage" "left right"}
#stage{grid-area:stage;display:grid;place-items:center;min-width:0;min-height:0}
#cv{display:block;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 0 3px rgba(159,232,255,.2)}
.zone{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0;position:relative}
#left{grid-area:left}#right{grid-area:right}
.top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#right .top{justify-content:flex-end}
.lvl{font-family:var(--f-disp);font-size:22px;line-height:1;width:100%;text-transform:uppercase;letter-spacing:.03em}
.lvl small{display:block;font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.chip{background:rgba(10,20,48,.4);border:1px solid rgba(238,234,224,.28);border-radius:0;padding:6px 10px;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip b{color:var(--gold)}
.chip.score{transition:transform .12s}
.chip.score.bump{transform:scale(1.15)}
.chip.net{background:#1f5a4a}
.iconbtn{width:38px;height:38px;border-radius:0;border:1px solid rgba(238,234,224,.28);background:rgba(10,20,48,.4);color:var(--text);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ice);outline-offset:2px}

#joyzone{flex:1;position:relative;touch-action:none;border-radius:20px;min-height:110px}
#joy{position:absolute;left:50%;top:58%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;
  background:radial-gradient(circle,rgba(159,232,255,.08) 40%,rgba(159,232,255,.16));border:2px solid rgba(159,232,255,.35);opacity:.6;pointer-events:none}
#joy.act{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffffff,#9fe8ff 50%,#3c86d6);box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 -4px 0 rgba(20,60,120,.35)}
#joy .ar{position:absolute;width:0;height:0;border:8px solid transparent;opacity:.45;transition:opacity .1s}
#joy .ar.on{opacity:1}
#joy .au{left:50%;top:6px;margin-left:-8px;border-bottom-color:var(--ice);border-top:0}
#joy .ad{left:50%;bottom:6px;margin-left:-8px;border-top-color:var(--ice);border-bottom:0}
#joy .al{top:50%;left:6px;margin-top:-8px;border-right-color:var(--ice);border-left:0}
#joy .ard{top:50%;right:6px;margin-top:-8px;border-left-color:var(--ice);border-right:0}
.zlabel{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);pointer-events:none;opacity:.8}

#icezone{flex:1;position:relative;touch-action:none;display:grid;place-items:center;min-height:110px}
#icebtn{width:118px;height:118px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#effcff,#86dcff 45%,#2f8fd8);
  box-shadow:0 7px 0 #1b5a96,0 0 34px rgba(127,216,255,.35);color:#0b2a55;
  font-family:var(--f-disp);font-size:16px;letter-spacing:.08em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .06s,box-shadow .06s}
#icebtn.on{transform:translateY(5px) scale(.97);box-shadow:0 2px 0 #1b5a96,0 0 50px rgba(127,216,255,.7)}
#icebtn svg{width:38px;height:38px}
#icebtn.on svg{animation:spin .35s ease-out}
@keyframes spin{to{transform:rotate(60deg)}}
body.port .zone{height:auto;min-height:var(--zoneH,230px)}
body.port .lvl{font-size:18px}
body.pad #joy,body.pad #icebtn,body.pad .zlabel{display:none}
body.pad #joyzone::after,body.pad #icezone::after{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:600 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:pre-line}
body.pad #joyzone::after{content:"Mando\A cruceta / palanca"}
body.pad #icezone::after{content:"A · hielo\A Start · pausa"}

/* ---------- Menus: editorial archive — bone paper, ink rules, condensed caps, serif italics, dark specimen window ---------- */
#ov{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  background:rgba(6,12,32,.62);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);color:var(--ink);font-family:var(--f-mono)}
#ov.full{display:block;padding:0;background:var(--bone);backdrop-filter:none;-webkit-backdrop-filter:none}
:where(#ov) button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;background:none;border:0;padding:0;border-radius:0}
#ov :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scr{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bone) radial-gradient(circle at 1px 1px,rgba(20,20,20,.09) 1px,transparent 1.5px) 0 0/14px 14px;overflow:hidden}
.bar{display:flex;align-items:center;gap:14px;padding-block:9px;border-bottom:1.5px solid var(--ink);min-width:0}
.logo{font-family:var(--f-disp);font-size:22px;letter-spacing:.03em;line-height:1;white-space:nowrap;text-transform:uppercase}
.logo i{font-family:var(--f-ser);font-style:italic;text-transform:lowercase;font-size:1.18em;margin-left:3px;letter-spacing:0;color:var(--accent)}
.bar nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.bar nav::-webkit-scrollbar{display:none}
.nav{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;white-space:nowrap;border:1px solid transparent;transition:background .18s,color .18s}
.nav b{font-weight:600}
.nav em{font-style:normal}
.nav.on{border-color:var(--ink)}
@media (hover:hover){.nav:hover{background:var(--ink);color:var(--bone)}}
.clock{font-size:11px;letter-spacing:.08em;white-space:nowrap;font-variant-numeric:tabular-nums}
.clock i{font-style:normal;color:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.eyebrow,.sechead,.meta{font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.sechead{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.home{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;min-height:0;padding-block:14px}
.lead{display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:0;min-height:0}
.scr h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(38px,13cqh,96px);line-height:.88;margin:0;text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.scr h1.sm{font-size:clamp(30px,10cqh,70px)}
.scr h1 i,.sub i,.dlg i{font-family:var(--f-ser);font-style:italic;text-transform:none;letter-spacing:0;font-weight:400}
.scr h1 i{font-size:1.08em;color:var(--accent)}
.sub{font-family:var(--f-ser);font-size:clamp(16px,3.8cqh,22px);line-height:1.22;margin:0;max-width:36ch;color:var(--ink2)}
.ctas{display:flex;gap:8px;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  padding:12px 16px;border:1.5px solid var(--ink);color:var(--ink);
  background:linear-gradient(var(--ink),var(--ink)) no-repeat 0 100%/100% 0;transition:background-size .24s cubic-bezier(.2,.8,.2,1),color .24s}
.cta span{display:inline-block;transition:transform .24s}
.cta:focus-visible{background-size:100% 100%;color:var(--bone)}
@media (hover:hover){.cta:hover{background-size:100% 100%;color:var(--bone)}}
.cta:focus-visible span{transform:translateX(4px)}
@media (hover:hover){.cta:hover span{transform:translateX(4px)}}
.cta.primary{background:var(--ink) linear-gradient(var(--accent),var(--accent)) no-repeat 0 100%/100% 0;color:var(--bone);border-color:var(--ink)}
.cta.primary:focus-visible{background-size:100% 100%;color:#fff;border-color:var(--accent)}
@media (hover:hover){.cta.primary:hover{background-size:100% 100%;color:#fff;border-color:var(--accent)}}
.cta:active{transform:translateY(1px)}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink2)}
.meta b{color:var(--ink);font-weight:600}
.fig{position:relative;margin:0;background-color:var(--night);color:var(--bone);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;min-height:0;overflow:hidden;
  background-image:linear-gradient(rgba(159,232,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(159,232,255,.07) 1px,transparent 1px);background-size:22px 22px;background-position:center}
.figtop,.figlist{display:flex;justify-content:space-between;gap:10px;font-size:10px;letter-spacing:.1em;padding:8px 10px;text-transform:uppercase;color:#cfd8ea}
.figtop{border-bottom:1px solid rgba(238,234,224,.18)}
.figlist{border-top:1px solid rgba(238,234,224,.18);justify-content:flex-start;gap:18px}
#hero{width:100%;height:100%;min-height:0;display:block;touch-action:none;cursor:grab}
.figcap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 10px 8px}
.figcap div{min-width:0}
.figcap b{display:block;font-family:var(--f-disp);font-weight:400;font-size:clamp(20px,6cqh,30px);letter-spacing:.03em;text-transform:uppercase;line-height:1;text-align:center}
.figcap small{display:block;font-family:var(--f-ser);font-style:italic;font-size:15px;text-align:center;color:#cfd8ea}
.arr{flex:none;width:40px;height:40px;border:1px solid rgba(238,234,224,.45);color:var(--bone);font-size:17px;transition:background .18s,color .18s}
.arr:focus-visible{background:var(--bone);color:var(--night)}
@media (hover:hover){.arr:hover{background:var(--bone);color:var(--night)}}
.crn{position:absolute;width:12px;height:12px;border:0 solid var(--accent);pointer-events:none}
.crn.tl{top:36px;left:8px;border-top-width:2px;border-left-width:2px}
.crn.tr{top:36px;right:8px;border-top-width:2px;border-right-width:2px}
.crn.bl{bottom:96px;left:8px;border-bottom-width:2px;border-left-width:2px}
.crn.br{bottom:96px;right:8px;border-bottom-width:2px;border-right-width:2px}
.tick{border-top:1.5px solid var(--ink);overflow:hidden;white-space:nowrap;font-size:11px;letter-spacing:.14em;padding-block:7px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)))}
.tick div{display:inline-flex;animation:mq 40s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.rv{animation:rv .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*65ms)}
@keyframes rv{from{opacity:0;transform:translateY(14px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:none;clip-path:inset(0 0 -20% 0)}}

/* levels */
.lv-scr{display:flex;flex-direction:column;gap:10px;padding-block:12px;min-height:0}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:1fr;gap:8px;flex:1;min-height:0}
.exp{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:3px;text-align:left;border:1.5px solid var(--ink);padding:8px 9px;background:var(--bone);transition:background .2s,color .2s;min-width:0;min-height:0;overflow:hidden}
.exp .code,.exp small{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.exp b{font-family:var(--f-disp);font-weight:400;font-size:clamp(14px,4.4cqh,22px);line-height:1;text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.exp .st{color:var(--accent);letter-spacing:2px;font-size:13px}
.st i,.dstars i{color:rgba(20,20,20,.18);font-style:normal}
.exp:focus-visible{background:var(--ink);color:var(--bone)}
@media (hover:hover){.exp:hover:not(:disabled){background:var(--ink);color:var(--bone)}}
.exp:focus-visible .st i{color:rgba(238,234,224,.25)}
@media (hover:hover){.exp:hover:not(:disabled) .st i{color:rgba(238,234,224,.25)}}
.exp.lock{border-style:dashed;color:var(--ink2);cursor:default;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(20,20,20,.07) 6px 7px)}
.exp.next{box-shadow:inset 0 0 0 3px var(--accent)}

/* how to */
.how-scr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:22px;padding-block:12px;min-height:0;overflow:auto;touch-action:pan-y}
.steps ol{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:4px}
.steps li>b{font-size:11px;letter-spacing:.1em;font-weight:600;color:var(--accent)}
.steps strong{display:inline;font-family:var(--f-disp);font-weight:400;font-size:17px;margin-right:6px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.steps li span{font-family:var(--f-ser);font-size:15px;line-height:1.2;color:var(--ink2)}
.bgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.bcell{background:var(--night);color:var(--bone);padding:6px 4px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;min-width:0}
.bcell canvas{width:44px;height:44px}
.bcell small{font-size:9px;letter-spacing:.1em;color:#9fb0cf}
.bcell b{font-family:var(--f-disp);font-weight:400;font-size:15px;text-transform:uppercase;letter-spacing:.03em}
.bcell span{font-family:var(--f-ser);font-style:italic;font-size:13px;color:#cfd8ea;line-height:1.05}
.bcell.txt{background:var(--ink);align-items:flex-start;justify-content:center;gap:2px;padding:6px 8px;text-align:left}
.bcell.txt small{color:var(--accent)}
.bcell.txt span{font-style:normal;font-family:var(--f-mono);font-size:9.5px;letter-spacing:0;line-height:1.25;color:var(--bone)}
.bcell.txt span b{font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}

/* multiplayer form + lobby */
.form{display:grid;gap:9px;max-width:440px}
.fld{display:grid;gap:3px}
.fld>b{font-size:10px;letter-spacing:.12em;font-weight:600;text-transform:uppercase}
.fld input{width:100%;min-width:0;border:0;border-bottom:1.5px solid var(--ink);background:transparent;font:400 22px var(--f-disp);letter-spacing:.06em;text-transform:uppercase;padding:3px 0;color:var(--ink);border-radius:0;outline:0}
.fld input:focus{border-bottom-color:var(--accent)}
.fld input::placeholder{color:rgba(20,20,20,.28)}
.fld .row{display:flex;gap:10px;align-items:end}
.cta.busy{opacity:.55;pointer-events:none}
.cta.busy span{animation:blink 1s steps(2) infinite}
.msg{min-height:15px;font-size:11px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.roomcode{font-family:var(--f-disp);font-size:clamp(56px,24cqh,150px);line-height:.85;letter-spacing:.14em;user-select:text;-webkit-user-select:text}
.lvsel>b{font-size:10px;letter-spacing:.12em;font-weight:600}
.lvsel div{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.lvb{width:34px;height:30px;border:1px solid var(--ink);font-size:12px;font-weight:600}
.lvb.sel{background:var(--ink);color:var(--bone)}
.lvb:disabled{opacity:.25;cursor:default}
.roster{display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0;justify-content:center}
.prow{display:grid;grid-template-columns:44px 28px minmax(0,1fr) auto;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-block:5px}
.prow canvas{width:44px;height:44px;background:var(--night)}
.prow i{display:block;width:44px;height:44px;border:1px dashed rgba(20,20,20,.3)}
.prow b{font-size:11px;letter-spacing:.1em;font-weight:600}
.prow span{font-family:var(--f-disp);font-size:22px;text-transform:uppercase;letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow small{font-size:10px;letter-spacing:.1em;color:var(--ink2);text-transform:uppercase}
.prow.empty span{color:rgba(20,20,20,.25)}

/* dialogs */
.dlg{width:100%;max-width:440px;background:var(--bone);color:var(--ink);border:1.5px solid var(--ink);box-shadow:8px 8px 0 var(--accent);padding:14px 18px 18px;max-height:100%;overflow:auto;touch-action:pan-y;animation:dlg .38s cubic-bezier(.2,.9,.2,1) both}
@keyframes dlg{from{transform:translate(-8px,14px);opacity:0;box-shadow:0 0 0 var(--accent)}}
.dtop{display:flex;justify-content:space-between;gap:10px;font-size:10px;letter-spacing:.12em;border-bottom:1px solid var(--ink);padding-bottom:6px;text-transform:uppercase}
.dlg h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(34px,11cqh,56px);line-height:.9;text-transform:uppercase;margin:12px 0 6px;letter-spacing:.01em}
.dlg p{font-family:var(--f-ser);font-size:18px;line-height:1.28;margin:0 0 14px;color:var(--ink2)}
.dbtns{display:flex;flex-wrap:wrap;gap:8px}
.dstars{font-size:40px;letter-spacing:6px;color:var(--accent);line-height:1;margin:2px 0 8px}

/* fit short landscape phones and portrait */
@media (max-height:420px){.figlist,.home .eyebrow{display:none}.home{padding-block:10px}.scr h1{font-size:clamp(34px,12cqh,80px)}.crn.bl,.crn.br{bottom:60px}.cta{padding:10px 14px}}
@container (max-width:860px){.clock{display:none}}
@container (max-width:700px){.nav em{display:none}}
body.port .scr{overflow:auto;touch-action:pan-y}
body.port .home,body.port .how-scr{grid-template-columns:1fr}
body.port .fig{height:300px}
body.port .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (prefers-reduced-motion:reduce){.rv,.dlg,.tick div,.clock i{animation:none}}

/* gamepad focus, chapters, room settings, on-screen keyboard */
#ov .pf{outline:3px solid var(--accent);outline-offset:3px}
.cta.pf{background-size:100% 100%;color:var(--bone)}
.cta.primary.pf{color:#fff;border-color:var(--accent)}
.exp.pf,.nav.pf{background:var(--ink);color:var(--bone)}
.exp.pf .st i{color:rgba(238,234,224,.25)}
.padhint{display:none;position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:6px;z-index:7;background:var(--ink);color:var(--bone);font:600 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-left:3px solid var(--accent);pointer-events:none;white-space:nowrap}
body.pad .padhint{display:block}

const Music={cur:null,want:null,step:0,next:0,timer:null,gain:null,muffle:false,
  kick(){if(this.timer||!AC)return;this.timer=setInterval(()=>this.pump(),25)},
  set(name,muffle){this.want=name;this.muffle=!!muffle},
  pump(){

const NET={mode:'solo',lobby:undefined,room:null,code:'',started:false,a:0,lastD:null,lastSt:null,seenHost:false,sendT:0,rosterT:0,unsub:null,selLv:0,away:false,inGame:false,hostPlaying:false,
  cfg:{lives:[1,3,5,0].includes(save.mp&&save.mp.lives)?save.mp.lives:3,diff:save.mp&&[0,1,2].includes(save.mp.diff)?save.mp.diff:1}};
const snow=Array.from({length:34},()=>({x:Math.random()*COLS,y:Math.random()*ROWS,r:.03+Math.random()*.05,v:.0004+Math.random()*.0006,ph:Math.random()*6}));

function roster(){
  if(NET.mode==='solo')return[{id:'local',ch:save.char,nm:''}];
  const list=[{id:'host',ch:save.char,nm:save.name||'Anfitrión'}];
  if(NET.room)for(const p of NET.room.peers()){const pr=p.presence||{};if(p.isMe||pr.role!=='guest'||pr.away)continue;
    list.push({id:p.peer,ch:Math.abs(pr.ch|0)%CHARS.length,nm:String(pr.nm||'Jugador').slice(0,12)})}
  return list.slice(0,4);
}
function makePlayer(r,k){
  const sp=S.spawns[k%S.spawns.length];
  return{id:r.id,ch:r.ch,nm:r.nm,x:sp[0],y:sp[1],nx:sp[0],ny:sp[1],t:0,moving:false,face:'right',mdir:null,actT:-1e9,eatT:-1e9,squash:0,lean:0,
    rx:sp[0],ry:sp[1],dead:false,deadT:0,respawnAt:0,inv:now+1500,inD:null,lastA:remoteA(r.id),justTp:false,sliding:false,k,
    lives:NET.mode==='solo'?1:(NET.cfg.lives||Infinity),out:false};
}
function remoteA(id){if(!NET.room||id==='host'||id==='local')return 0;const p=NET.room.peers().find(q=>q.peer===id);return p&&p.presence&&p.presence.inp?(p.presence.inp.a|0):0}

function loadLevel(i,guest){
  const L=LEVELS[i];
  S={li:i,L,gid:++GID,grid:[],kind:[],iceT:{},crack:{},fruits:[],enemies:[],players:[],spawns:[],portals:[],doors:[],wave:1,maxWave:1,time:0,
     state:'intro',introT:2400,parts:[],shake:0,flash:0,score:0,combo:0,lastEat:-1e9,deathT:0,doorOpen:false,live:true,stars:0};
  let P=null;const enemySpots=[];
  L.map.forEach((row,y)=>{S.grid.push([]);S.kind.push([]);[...row].forEach((ch,x)=>{
    let g=0,k='';
    if(ch==='#')g=1;else if(ch==='I'||ch==='a'||ch==='b')g=2;else if(ch==='H')g=3;else if(ch==='L'){g=5;k='L'}
    else if(ch==='S')k='S';else if(ch==='T'){k='T';S.portals.push([x,y])}else if(ch==='X'){k='X';g=6;S.doors.push([x,y])}
    S.grid[y].push(g);S.kind[y].push(k);
    let w=0;if('123'.includes(ch))w=+ch;if(ch==='a')w=1;if(ch==='b')w=2;
    if(w){S.fruits.push({x,y,wave:w,kind:L.fruits[w-1],eaten:false,spawnT:-1e9,ph:Math.random()*6});S.maxWave=Math.max(S.maxWave,w)}
    if(ch==='P')P=[x,y];
    if(EKEY[ch])enemySpots.push([EKEY[ch],x,y]);
  })});
  S.portalDest={};for(let k=0;k+1<S.portals.length;k+=2){const[a,b]=[S.portals[k],S.portals[k+1]];S.portalDest[a+'']=b;S.portalDest[b+'']=a}
  // spawn points: start tile, then nearest free floor
  const taken=new Set(enemySpots.map(e=>e[1]+','+e[2]).concat(S.fruits.map(f=>f.x+','+f.y)));
  const seen=new Set([P+'']),q=[P];S.spawns.push(P);
  for(let h=0;h<q.length&&S.spawns.length<4;h++){const[x,y]=q[h];for(const d of DL){const nx=x+D[d][0],ny=y+D[d][1],k=nx+','+ny;
    if(seen.has(k)||!inb(nx,ny)||S.grid[ny][nx]!==0||S.kind[ny][nx])continue;seen.add(k);q.push([nx,ny]);if(!taken.has(k)&&S.spawns.length<4)S.spawns.push([nx,ny])}}
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(S.grid[y][x]>=2&&S.grid[y][x]<=3)S.iceT[x+','+y]=now+300+(x+y)*25;
  S.fruits.filter(f=>f.wave===1).forEach((f,k)=>f.spawnT=now+400+k*50);
  if(!guest){
    for(const[type,x,y]of enemySpots)S.enemies.push(makeEnemy(type,x,y));
    roster().forEach((r,k)=>S.players.push(makePlayer(r,k)));
  }
  inputs.length=0;
  buildStatic();hud();
  $('hLvl').textContent='Nivel '+(i+1);$('hName').textContent=L.name;
}
function makeEnemy(type,x,y,dir){return{id:++EID,type,x,y,nx:x,ny:y,t:0,moving:false,dir:dir||DL[(Math.random()*4)|0],spd:BASE_SPD[type]*(S?S.L.spd:1)*diffMul(),melt:0,mx:0,my:0,roll:0,ph:Math.random()*6,rx:x,ry:y,cool:1600+Math.random()*1400,flare:-1e9,dead:false}}
const inb=(x,y)=>x>=0&&y>=0&&x<COLS&&y<ROWS;
const cell=(x,y)=>inb(x,y)?S.grid[y][x]:1;
const kindAt=(x,y)=>inb(x,y)?S.kind[y][x]:'';
const isIce=c=>c>=2&&c<=4;
function enemyAt(x,y){return S.enemies.some(e=>(e.x===x&&e.y===y)||(e.moving&&e.nx===x&&e.ny===y)||(e.melt>0&&e.mx===x&&e.my===y))}
function playerAt(x,y){return S.players.some(p=>!p.dead&&((p.x===x&&p.y===y)||(p.moving&&p.nx===x&&p.ny===y)))}
function ptile(p){return p.moving&&p.t>.5?{x:p.nx,y:p.ny}:{x:p.x,y:p.y}}
const alive=()=>S.players.filter(p=>!p.dead);
function localPlayer(){return S&&S.players.find(p=>p.id==='local'||p.id==='host'||(NET.mode==='guest'&&p.id===NET.me))}

/* ---------- input ---------- */
const inputs=[];let joyDir=null,lastDir=null,lastDirT=-1e9;
function noteRelease(d){if(d){lastDir=d;lastDirT=now}}
function press(id,d){const k=inputs.findIndex(o=>o.id===id);if(k>=0)inputs.splice(k,1);inputs.push({id,d})}
function release(id){const k=inputs.findIndex(o=>o.id===id);if(k>=0){noteRelease(inputs[k].d);inputs.splice(k,1)}}
function curDir(){if(!ov.hidden)return null;return joyDir||(inputs.length?inputs[inputs.length-1].d:null)}
/* A quick flick that ends before the next tile still counts as one turn — but never as an extra step forward. */
function bufferedDir(p){if(now-lastDirT<230&&lastDir&&lastDir!==p.mdir&&lastDir!==p.face){const d=lastDir;lastDirT=-1e9;return d}return null}
const ctrlMode=()=>['joy','swipe','dpad'].includes(save.ctrl)?save.ctrl:'joy';

const jz=$('joyzone'),joy=$('joy'),knob=$('knob'),dpv=$('dpadv'),swv=$('swipev');
const arrowSets=[joy,dpv,swv].map(el=>({up:el.querySelector('.au'),down:el.querySelector('.ad'),left:el.querySelector('.al'),right:el.querySelector('.ard')}));
let jp=null,sw=null;
function joyRest(){joy.style.left='50%';joy.style.top='58%';knob.style.transform='';joy.classList.remove('act');setJoyDir(null)}
function setJoyDir(d){if(d===joyDir)return;if(joyDir&&!d)noteRelease(joyDir);joyDir=d;
  for(const set of arrowSets)for(const k in set)if(set[k])set[k].classList.toggle('on',k===d);
  if(d)buzz(6)}
function swipeTo(e){
  if(!sw||sw.id!==e.pointerId)return;
  const dx=e.clientX-sw.ax,dy=e.clientY-sw.ay,th=16;
  if(Math.abs(dx)<th&&Math.abs(dy)<th)return;
  setJoyDir(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
  sw.moved=true;sw.ax=e.clientX;sw.ay=e.clientY;
}
jz.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();const m=ctrlMode();
  if(m==='swipe'){sw={id:e.pointerId,ax:e.clientX,ay:e.clientY,moved:false};try{jz.setPointerCapture(e.pointerId)}catch(_){}return}
  if(jp)return;try{jz.setPointerCapture(e.pointerId)}catch(_){}
  if(m==='dpad'){const q=dpv.getBoundingClientRect();jp={id:e.pointerId,cx:q.left+q.width/2,cy:q.top+q.height/2,fixed:true};joyMove(e);return}
  const r=jz.getBoundingClientRect(),half=joy.offsetWidth/2||66;
  const cx=Math.min(Math.max(e.clientX-r.left,half),r.width-half),cy=Math.min(Math.max(e.clientY-r.top,half),r.height-half);
  jp={id:e.pointerId,cx:r.left+cx,cy:r.top+cy,fixed:false};joy.style.left=cx+'px';joy.style.top=cy+'px';joy.classList.add('act');joyMove(e);
});
function joyMove(e){
  if(sw){swipeTo(e);return}
  if(!jp||jp.id!==e.pointerId)return;
  let dx=e.clientX-jp.cx,dy=e.clientY-jp.cy;const dist=Math.hypot(dx,dy),max=(joy.offsetWidth||132)*.3;
  if(!jp.fixed){const k=dist>max?max/dist:1;knob.style.transform=`translate(${dx*k}px,${dy*k}px)`}
  if(dist<(jp.fixed?8:10)){setJoyDir(null);return}
  const ax=Math.abs(dx),ay=Math.abs(dy);let d;
  if(joyDir==='left'||joyDir==='right')d=ay>ax*1.1?(dy>0?'down':'up'):(dx>0?'right':'left');
  else if(joyDir==='up'||joyDir==='down')d=ax>ay*1.1?(dx>0?'right':'left'):(dy>0?'down':'up');
  else d=ax>ay?(dx>0?'right':'left'):(dy>0?'down':'up');
  setJoyDir(d);
  if(!jp.fixed&&dist>max+18){jp.cx+=dx*(1-(max+18)/dist);jp.cy+=dy*(1-(max+18)/dist)}
}
jz.addEventListener('pointermove',joyMove);
const joyEnd=e=>{
  if(sw&&sw.id===e.pointerId){if(!sw.moved)setJoyDir(null);sw=null;return} // swipe: a tap stops, a swipe keeps going
  if(!jp||jp.id!==e.pointerId)return;jp=null;joyRest()};
jz.addEventListener('pointerup',joyEnd);jz.addEventListener('pointercancel',joyEnd);jz.addEventListener('lostpointercapture',joyEnd);

const iz=$('icezone'),ib=$('icebtn');
function iceFx(){ib.classList.remove('on');void ib.offsetWidth;ib.classList.add('on');setTimeout(()=>ib.classList.remove('on'),140)}
iz.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();iceFx();localAct()});
/* Board: tap = ice. In swipe mode a swipe on the board also steers. */
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();
  if(ctrlMode()==='swipe'){sw={id:e.pointerId,ax:e.clientX,ay:e.clientY,moved:false,board:true};try{cv.setPointerCapture(e.pointerId)}catch(_){}return}
  localAct()});
cv.addEventListener('pointermove',e=>{if(sw&&sw.board)swipeTo(e)});
const cvEnd=e=>{if(sw&&sw.board&&sw.id===e.pointerId){if(!sw.moved&&e.type==='pointerup')localAct();sw=null}};
cv.addEventListener('pointerup',cvEnd);cv.addEventListener('pointercancel',cvEnd);
function applySettings(){
  const b=document.body.classList,m=ctrlMode();
  b.toggle('ctrl-joy',m==='joy');b.toggle('ctrl-swipe',m==='swipe');b.toggle('ctrl-dpad',m==='dpad');
  b.toggle('big',!!save.big);b.toggle('lefty',!!save.lefty);
  const lab=jz.querySelector('.zlabel');if(lab)lab.textContent={joy:'Mover',swipe:'Toca para parar',dpad:'Cruceta'}[m];
  setJoyDir(null);sw=null;jp=null;resize();
}

const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  if(KEYS[e.key]){e.preventDefault();if(!e.repeat)press('k'+e.key.toLowerCase(),KEYS[e.key]);audioInit()}
  else if(e.key===' '||e.key==='j'||e.key==='J'){if(!ov.hidden)return;e.preventDefault();if(!e.repeat){iceFx();localAct()}}
  else if(e.key==='Escape'||e.key==='p'||e.key==='P'){togglePause()}
});
window.addEventListener('keyup',e=>{if(KEYS[e.key])release('k'+e.key.toLowerCase())});
window.addEventListener('blur',()=>{inputs.length=0;jp=null;joyRest()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&NET.mode==='solo'&&S&&S.live&&(S.state==='play'||S.state==='intro')&&ov.hidden)showPause()});

/* ---------- gamepad ---------- */
const pad={dir:null,a:false,x:false,start:false,back:false,lb:false,rb:false,rt:false,nav:null,navT:0,rep:false,on:false};
function setPadMode(on){if(document.body.classList.contains('pad')===on)return;document.body.classList.toggle('pad',on);resize()}
window.addEventListener('gamepadconnected',()=>{toast('Mando conectado');pad.on=true;setPadMode(true)});
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')setPadMode(false)},true);
window.addEventListener('gamepaddisconnected',()=>{toast('Mando desconectado');pad.on=false;setPadMode(false);release('pad')});
function pollPad(){
  let pads=[];try{pads=navigator.getGamepads?[...navigator.getGamepads()].filter(Boolean):[]}catch(e){return}
  if(!pads.length)return;const g=pads[0],b=i=>!!(g.buttons[i]&&g.buttons[i].pressed);
  const ax=g.axes[0]||0,ay=g.axes[1]||0;let dir=null;
  if(b(12))dir='up';else if(b(13))dir='down';else if(b(14))dir='left';else if(b(15))dir='right';
  else if(Math.hypot(ax,ay)>.5)dir=Math.abs(ax)>Math.abs(ay)?(ax>0?'right':'left'):(ay>0?'down':'up');
  const a=b(0),x=b(2),st=b(9),back=b(1),lb=b(4),rb=b(5),rt=b(7);
  if(!pad.on)pad.on=true;
  if(dir||a||x||st||back||lb||rb||rt)setPadMode(true);
  if(!ov.hidden){ // menus: spatial focus, A accept, B back, X delete, LB/RB sections, Start confirm
    if(dir&&(dir!==pad.nav||now-pad.navT>(pad.rep?110:320))){pad.rep=dir===pad.nav;pad.nav=dir;pad.navT=now;navSpatial(dir)}
    if(!dir){pad.nav=null;pad.rep=false}
    if(a&&!pad.a)padActivate();
    if(x&&!pad.x&&vkOpen()){const k=$('vk').querySelector('[data-k="⌫"]');k&&k.click()}
    if(back&&!pad.back){SFX.ui();window.ppBack()}
    if(lb&&!pad.lb&&!vkOpen())cycleTabs(-1);
    if(rb&&!pad.rb&&!vkOpen())cycleTabs(1);
    if(st&&!pad.start){if(vkOpen())closeVk();else if(ov.dataset.screen==='pause')closeOv();else{const p=ov.querySelector('.cta.primary:not([hidden])');if(p){SFX.ui(1);p.click()}}}
  }else{
    if(dir!==pad.dir){if(dir)press('pad',dir);else release('pad')}
    if((a&&!pad.a)||(x&&!pad.x)||(rb&&!pad.rb)||(rt&&!pad.rt)){iceFx();localAct()}
    if(st&&!pad.start)togglePause();
  }
  pad.dir=ov.hidden?dir:null;pad.a=a;pad.x=x;pad.start=st;pad.back=back;pad.lb=lb;pad.rb=rb;pad.rt=rt;
}

/* ---------- actions ---------- */
function localAct(){
  if(!S||!ov.hidden||S.state!=='play')return;
  if(NET.mode==='guest'){NET.a++;sendInput(true);return}
  const p=localPlayer();if(p)act(p);
}
function hitIce(x,y,delay=0){
  const c=cell(x,y);
  if(c===3){S.grid[y][x]=4;crackFx(x,y);SFX.crack();return}
  if(c===2||c===4){S.grid[y][x]=0;delete S.iceT[x+','+y];S.crack[x+','+y]=now+delay;shatter(x,y,delay)}
}
function canPlaceIce(x,y){return cell(x,y)===0&&!kindAt(x,y)&&!enemyAt(x,y)&&!playerAt(x,y)}
function act(p){
  if(p.dead||now-p.actT<150)return;
  const o=p.moving?{x:p.nx,y:p.ny}:{x:p.x,y:p.y},[dx,dy]=D[p.face];
  let x=o.x+dx,y=o.y+dy,n=0;p.actT=now;
  frost(o.x,o.y,dx,dy);
  if(isIce(cell(x,y))){
    while(isIce(cell(x,y))){const c=cell(x,y);hitIce(x,y,n*45);x+=dx;y+=dy;n++;if(c===3)break}
    SFX.brk();if(isLocal(p))buzz(18);S.shake=Math.max(S.shake,3);
  }else{
    while(canPlaceIce(x,y)){S.grid[y][x]=2;S.iceT[x+','+y]=now+n*45;glint(x,y,n*45);x+=dx;y+=dy;n++}
    if(n){SFX.ice(n);if(isLocal(p))buzz(10)}else{SFX.bump();if(isLocal(p))S.shake=Math.max(S.shake,2)}
  }
}
const isLocal=p=>p.id==='local'||p.id==='host';

/* ---------- particles ---------- */
function part(o){S.parts.push(Object.assign({vx:0,vy:0,g:0,life:600,age:0,delay:0,size:3,color:'#fff',shape:'c',rot:0,vr:0,add:false},o))}
function shatter(x,y,delay){for(let i=0;i<10;i++){const a=Math.random()*6.28,s=.002+Math.random()*.004;part({x:x+.5,y:y+.5,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.002,g:.00001,life:450+Math.random()*250,delay,size:.07+Math.random()*.08,color:Math.random()<.5?'#e8fbff':'#8fdcff',shape:'s',rot:Math.random()*6,vr:(Math.random()-.5)*.02})}}
function crackFx(x,y){for(let i=0;i<5;i++){const a=Math.random()*6.28;part({x:x+.5,y:y+.5,vx:Math.cos(a)*.003,vy:Math.sin(a)*.003,life:300,size:.06,color:'#cfefff',shape:'s',rot:a})}}
function glint(x,y,delay){part({x:x+.5,y:y+.3,life:380,delay,size:.16,color:'#ffffff',shape:'x',add:true});for(let i=0;i<3;i++)part({x:x+.2+Math.random()*.6,y:y+.9,vy:-.002-Math.random()*.002,vx:(Math.random()-.5)*.001,life:420,delay,size:.05,color:'#dff8ff'})}
function frost(x,y,dx,dy){for(let i=0;i<10;i++){part({x:x+.5+dx*.3,y:y+.45+dy*.3,vx:dx*(.003+Math.random()*.004)+(Math.random()-.5)*.002,vy:dy*(.003+Math.random()*.004)+(Math.random()-.5)*.002,life:340,size:.05+Math.random()*.07,color:'rgba(230,250,255,.9)'})}}
function sparkle(x,y,color){for(let i=0;i<14;i++){const a=i/14*6.28,s=.0025+Math.random()*.002;part({x:x+.5,y:y+.5,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:520,size:.06+Math.random()*.05,color,shape:i%3?'c':'x',add:i%3===0})}}
function puff(x,y,colors,n=26,sp=.006){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*sp;part({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.002,g:.000012,life:700+Math.random()*500,size:.06+Math.random()*.12,color:colors[i%colors.length]})}}
function steam(x,y){part({x:x+.3+Math.random()*.4,y:y+.6,vy:-.0015-Math.random()*.001,vx:(Math.random()-.5)*.0008,life:600,size:.08+Math.random()*.06,color:'rgba(255,255,255,.55)'})}
function ember(x,y,col){part({x:x+.35+Math.random()*.3,y:y+.3,vy:-.0012-Math.random()*.001,vx:(Math.random()-.5)*.0008,life:500+Math.random()*300,size:.03+Math.random()*.03,color:col,add:true})}
function floatText(x,y,txt,col){part({x:x+.5,y:y+.2,vy:-.0012,life:800,size:.42,color:col,shape:'t',txt})}
function ring(x,y,col){for(let i=0;i<18;i++){const a=i/18*6.28;part({x:x+.5,y:y+.5,vx:Math.cos(a)*.004,vy:Math.sin(a)*.004,life:450,size:.06,color:col,add:true})}}

/* ---------- simulation (solo & host) ---------- */
const walkable=(x,y)=>cell(x,y)===0;
function canE(e,d){const x=e.x+D[d][0],y=e.y+D[d][1],c=cell(x,y);
  if(c===0||c===5)return true;if(isIce(c))return e.type==='melter'||e.type==='ghost';return false}
function bfs(sx,sy,targets,passIce){
  const goal=new Set(targets.map(t=>t.x+','+t.y));if(goal.has(sx+','+sy))return null;
  const seen=new Uint8Array(COLS*ROWS),q=[[sx,sy,null]];seen[sy*COLS+sx]=1;
  for(let h=0;h<q.length;h++){const[x,y,f]=q[h];
    for(const d of DL){const nx=x+D[d][0],ny=y+D[d][1];if(!inb(nx,ny)||seen[ny*COLS+nx])continue;const c=S.grid[ny][nx];
      if(c===1||c===6||(isIce(c)&&!passIce))continue;const fd=f||d;if(goal.has(nx+','+ny))return fd;seen[ny*COLS+nx]=1;q.push([nx,ny,fd])}}
  return null;
}
function decide(e){
  const tg=alive().map(ptile);
  const hunt={chaser:.82,melter:.88,ghost:.85}[e.type];
  if(hunt&&tg.length&&Math.random()<hunt){const d=bfs(e.x,e.y,tg,e.type!=='chaser');if(d)return d}
  if(e.type==='roller'&&canE(e,e.dir))return e.dir;
  const opts=DL.filter(d=>canE(e,d));if(!opts.length)return null;
  const fwd=opts.filter(d=>d!==OPP[e.dir]),pool=fwd.length?fwd:opts;
  const keep={wander:.55,spark:.35}[e.type]||0;
  if(keep&&pool.includes(e.dir)&&Math.random()<keep)return e.dir;
  return pool[(Math.random()*pool.length)|0];
}
function shoot(e){
  let dir=null;
  for(const p of alive()){const t=ptile(p);
    if(t.x===e.x||t.y===e.y){const dx=Math.sign(t.x-e.x),dy=Math.sign(t.y-e.y);let x=e.x+dx,y=e.y+dy,ok=true;

function guestUpdate(dt){
  for(const e of S.enemies){e.ph=(e.ph||0)+dt*.004;const k=Math.min(1,dt*.022);if(e.tx===undefined)continue;
    if(Math.hypot(e.tx-e.rx,e.ty-e.ry)>2){e.rx=e.tx;e.ry=e.ty}else{e.rx+=(e.tx-e.rx)*k;e.ry+=(e.ty-e.ry)*k}
    if((e.type==='wander'||e.type==='chaser'||e.type==='spark')&&Math.random()<dt*.012)ember(e.rx,e.ry,'#ffb347');
    if(e.type==='ball'&&Math.random()<dt*.05)ember(e.rx,e.ry,'#ffb347');
    if(e.melt&&Math.random()<.2)steam(e.rx+D[e.dir][0],e.ry+D[e.dir][1])}
  for(const p of S.players){const k=Math.min(1,dt*.025);if(p.tx===undefined)continue;
    if(Math.hypot(p.tx-p.rx,p.ty-p.ry)>2){p.rx=p.tx;p.ry=p.ty}else{p.rx+=(p.tx-p.rx)*k;p.ry+=(p.ty-p.ry)*k}

function focusables(){const root=vkOpen()?$('vk'):ov;return[...root.querySelectorAll('button:not([disabled]):not([hidden]),input')].filter(el=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0})}
function focusEl(el){if(!el)return;ov.querySelectorAll('.pf').forEach(x=>x.classList.remove('pf'));try{el.focus({preventScroll:false})}catch(e){el.focus()}el.classList.add('pf');
  try{el.scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){}}
function navSpatial(dir){
  const els=focusables();if(!els.length)return;let cur=document.activeElement;
  if(!cur||!els.includes(cur)){focusEl(els.find(e=>e.classList.contains('pf'))||els.find(e=>e.classList.contains('primary'))||els[0]);return}
  const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
  for(const el of els){if(el===cur)continue;const q=el.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2,dx=x-cx,dy=y-cy;
    let main,side;
    if(dir==='right'){if(q.left<r.right-4&&dx<=4)continue;main=dx;side=dy}
    else if(dir==='left'){if(q.right>r.left+4&&dx>=-4)continue;main=-dx;side=dy}
    else if(dir==='down'){if(q.top<r.bottom-4&&dy<=4)continue;main=dy;side=dx}
    else{if(q.bottom>r.top+4&&dy>=-4)continue;main=-dy;side=dx}
    if(main<=0)continue;const sc=main+Math.abs(side)*2.2;if(sc<bs){bs=sc;best=el}}
  if(best){focusEl(best);SFX.ui()}
}
function padActivate(){

function iceGlint(c,X,Y,s,x,y){

function drawIce(c,X,Y,s,sc,x,y,kind,noGlint){

  ctx.drawImage(staticLayer,0,0,W,H);

  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const k=S.kind[y][x];if(!k||k==='S')continue;const X=x*T,Y=y*T;
    if(k==='L'){ctx.drawImage(sprite('lava',T,(c2,sz)=>{const g=c2.createLinearGradient(0,0,0,sz);g.addColorStop(0,'#ffb347');g.addColorStop(1,'#e8341c');c2.fillStyle=g;c2.fillRect(0,0,sz,sz)}),X,Y,T,T);
      ctx.fillStyle='rgba(255,240,170,.7)';for(let i=0;i<3;i++){const ph=(now*.0007+hash(x+i,y)*5)%1;ctx.beginPath();ctx.arc(X+T*(.2+hash(i,x+y)*.6),Y+T*(.85-ph*.6),T*.06*(1-ph),0,6.28);ctx.fill()}
      ctx.strokeStyle='rgba(120,20,10,.35)';ctx.lineWidth=T*.04;ctx.beginPath();ctx.moveTo(X,Y+T*(.4+Math.sin(now*.003+x)*.05));ctx.quadraticCurveTo(X+T*.5,Y+T*(.3+Math.sin(now*.003+y)*.08),X+T,Y+T*.45);ctx.stroke()}
    else if(k==='T'){ctx.save();ctx.translate(X+T/2,Y+T*.55);for(let i=0;i<3;i++){ctx.rotate(now*.003+i*2.1);ctx.strokeStyle=['#c49bff','#8f6bff','#e6d6ff'][i];ctx.lineWidth=T*.06;ctx.beginPath();ctx.ellipse(0,0,T*(.34-i*.08),T*(.28-i*.07),0,0,4);ctx.stroke()}ctx.restore()}
    else if(k==='X'){
      ctx.fillStyle='#2a3c68';rr(ctx,X+T*.08,Y+T*.04,T*.84,T*.94,T*.32);ctx.fill();
      if(S.doorOpen){const g=ctx.createRadialGradient(X+T/2,Y+T*.6,0,X+T/2,Y+T*.6,T*.5);g.addColorStop(0,'#fffbe0');g.addColorStop(1,'#ffd34d');ctx.fillStyle=g;rr(ctx,X+T*.18,Y+T*.14,T*.64,T*.84,T*.26);ctx.fill();
        const b=Math.sin(now*.008)*T*.08;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.moveTo(X+T*.5,Y-T*.15+b);ctx.lineTo(X+T*.32,Y-T*.45+b);ctx.lineTo(X+T*.68,Y-T*.45+b);ctx.closePath();ctx.fill()}
      else{ctx.fillStyle='rgba(160,220,255,.9)';rr(ctx,X+T*.18,Y+T*.14,T*.64,T*.84,T*.26);ctx.fill();ctx.strokeStyle='#ffffff';ctx.lineWidth=T*.06;
        for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(X+T*(.18+i*.16),Y+T*.18);ctx.lineTo(X+T*(.18+i*.16),Y+T*.95);ctx.stroke()}}}
  }
  ctx.globalCompositeOperation='lighter';
  for(const e of S.enemies){const ex=(e.rx+.5)*T,ey=(e.ry+.55)*T,r=T*(e.type==='ball'?.8:1.15+Math.sin((e.ph||0)*2)*.08);
    const gl=sprite('glow'+e.type,T*2.6,(c2,sz)=>{const g=c2.createRadialGradient(sz/2,sz/2,0,sz/2,sz/2,sz/2);g.addColorStop(0,'rgba('+GLOW[e.type]+',.32)');g.addColorStop(1,'rgba('+GLOW[e.type]+',0)');c2.fillStyle=g;c2.fillRect(0,0,sz,sz)});ctx.drawImage(gl,ex-r,ey-r,r*2,r*2)}
  if(S.doorOpen)for(const[x,y]of S.doors){const r=T*1.6,X=(x+.5)*T,Y=(y+.5)*T,g=ctx.createRadialGradient(X,Y,0,X,Y,r);g.addColorStop(0,'rgba(255,220,100,.35)');g.addColorStop(1,'rgba(255,220,100,0)');ctx.fillStyle=g;ctx.fillRect(X-r,Y-r,r*2,r*2)}
  ctx.globalCompositeOperation='source-over';
  for(const k in S.crack){const t0=S.crack[k],a=(now-t0)/350;if(a<0)continue;if(a>1){delete S.crack[k];continue}
    const[x,y]=k.split(',').map(Number);ctx.strokeStyle='rgba(120,190,240,'+(1-a)*.7+')';ctx.lineWidth=T*.04;ctx.beginPath();
    ctx.moveTo((x+.2)*T,(y+.3)*T);ctx.lineTo((x+.5)*T,(y+.5)*T);ctx.lineTo((x+.8)*T,(y+.25)*T);ctx.moveTo((x+.5)*T,(y+.5)*T);ctx.lineTo((x+.45)*T,(y+.85)*T);ctx.stroke()}
  const items=[];
  for(const f of S.fruits){if(f.wave!==S.wave||f.eaten)continue;const a=(now-f.spawnT)/320;if(a<0)continue;
    const sc=ease(a),iced=isIce(S.grid[f.y][f.x]);
    items.push({y:f.y,z:0,fn:()=>{const bob=iced?0:Math.sin(now*.004+f.ph)*T*.05;
      if(!iced){ctx.fillStyle='rgba(30,60,110,.15)';ctx.beginPath();ctx.ellipse((f.x+.5)*T,(f.y+.84)*T,T*.22,T*.07,0,0,6.28);ctx.fill()}
      if(sc>=1){const z=T*1.3;ctx.drawImage(sprite('fr'+f.kind,z,(c2,sz)=>drawFruit(c2,f.kind,sz/2,sz/2,T)),(f.x+.5)*T-z/2,(f.y+.46)*T+bob-z/2,z,z)}
      else drawFruit(ctx,f.kind,(f.x+.5)*T,(f.y+.46)*T+bob,T*sc)}})}
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const g=S.grid[y][x];if(!isIce(g))continue;const t0=S.iceT[x+','+y];let sc=1;
    if(t0!==undefined){const a=(now-t0)/190;if(a<0)continue;sc=ease(a)}
    items.push({y,z:1,fn:()=>{if(sc>=1){ctx.drawImage(sprite('ice'+g,T,(c2,sz)=>drawIce(c2,0,0,sz,1,0,0,g,true)),x*T,y*T,T,T);iceGlint(ctx,x*T,y*T,T,x,y)}else drawIce(ctx,x*T,y*T,T,sc,x,y,g)}})}
  for(const e of S.enemies){const hop=e.moving&&e.type!=='roller'&&e.type!=='ball'&&e.type!=='ghost'?Math.sin(e.t*Math.PI)*T*.07:0,fl=e.type==='ghost'?Math.sin(now*.004+(e.ph||0))*T*.06:0;
    items.push({y:e.ry,z:2,fn:()=>{if(e.type!=='ball'){ctx.fillStyle='rgba(30,40,80,.2)';ctx.beginPath();ctx.ellipse((e.rx+.5)*T,(e.ry+.86)*T,T*.26,T*.08,0,0,6.28);ctx.fill()}
      const st=e.moving&&e.type!=='roller'&&e.type!=='ball'?Math.sin(e.t*Math.PI)*.08:0;ctx.save();ctx.translate((e.rx+.5)*T,(e.ry+.5)*T-hop+fl);ctx.scale(1-st*.5,1+st);drawEnemy(ctx,e,T,now);ctx.restore()}})}
  const exitA=S.state==='exit'?Math.min(1,(now-S.exitT)/700):0;
  for(const p of S.players){
    if(p.dead){const m=Math.min(1,(now-p.deadT)/900);if(now-p.deadT<2600)items.push({y:p.dy,z:3,fn:()=>{ctx.save();ctx.globalAlpha=Math.min(1,(2600-(now-p.deadT))/600);drawChar(ctx,p.ch,(p.dx+.5)*T,(p.dy+.5)*T,T,{face:p.face,tm:now,melt:m});ctx.restore()}});continue}
    const hop=p.moving&&!p.sliding?Math.sin(p.t*Math.PI)*T*.09:0,a=Math.max(0,1-(now-p.actT)/220),
      rec=a*T*.05,rx=p.face==='left'?rec:p.face==='right'?-rec:0,ry=p.face==='up'?rec:p.face==='down'?-rec:0,happy=now-p.eatT<260,
      blink=now<p.inv&&Math.floor(now/90)%2===0;
    let sx=(p.rx+.5)*T+rx,sy=(p.ry+.5)*T-hop+ry,scl=1;
    if(exitA>0){const dr=S.doors[0];if(dr){sx+=((dr[0]+.5)*T-sx)*exitA*(p.id===S.exiter?1:.0);sy+=((dr[1]+.5)*T-sy)*exitA*(p.id===S.exiter?1:0)}if(p.id===S.exiter)scl=1-exitA*.85}
    items.push({y:p.ry,z:3,fn:()=>{ctx.fillStyle='rgba(30,40,80,.2)';ctx.beginPath();ctx.ellipse((p.rx+.5)*T,(p.ry+.9)*T,T*.22*(1-hop/T),T*.07,0,0,6.28);ctx.fill();
      drawChar(ctx,p.ch,sx,sy,T*scl,{face:p.face,tm:now,squash:(p.squash||0)*.6+(p.moving?.18*Math.sin(p.t*Math.PI):0),act:a,lean:p.lean,happy,alpha:blink?.35:1});
      if(NET.mode!=='solo'){const me=isLocal(p)||p.id===NET.me,lab=(me?'Tú':(p.nm||''))+(p.lives!==undefined&&p.lives!==Infinity?' ♥'+p.lives:'');ctx.font=Math.round(T*.32)+'px "Lilita One",sans-serif';ctx.textAlign='center';ctx.lineWidth=T*.08;ctx.lineJoin='round';ctx.strokeStyle='rgba(10,20,48,.8)';ctx.strokeText(lab,sx,sy-T*.58);ctx.fillStyle=me?'#ffd34d':'#ffffff';ctx.fillText(lab,sx,sy-T*.58)}}})}
  items.sort((a,b)=>a.y-b.y||a.z-b.z).forEach(i=>i.fn());
  for(const q of S.parts){if(q.delay>0)continue;const k=1-q.age/q.life;ctx.globalAlpha=Math.max(0,k);ctx.fillStyle=q.color;const X=q.x*T,Y=q.y*T,R=q.size*T*(.5+.5*k);
    if(q.add)ctx.globalCompositeOperation='lighter';
    if(q.shape==='s'){ctx.save();ctx.translate(X,Y);ctx.rotate(q.rot);ctx.fillRect(-R,-R*.6,R*2,R*1.2);ctx.restore()}
    else if(q.shape==='x'){ctx.save();ctx.translate(X,Y);ctx.rotate(q.age*.01);ctx.fillRect(-R*1.4,-R*.25,R*2.8,R*.5);ctx.fillRect(-R*.25,-R*1.4,R*.5,R*2.8);ctx.restore()}
    else if(q.shape==='t'){const sz=Math.round(q.size*T*(q.age<120?.6+q.age/300:1));ctx.font=sz+'px "Lilita One",system-ui,sans-serif';ctx.textAlign='center';ctx.lineWidth=Math.max(2,sz*.18);ctx.strokeStyle='rgba(20,40,90,.8)';ctx.lineJoin='round';ctx.strokeText(q.txt,X,Y);ctx.fillText(q.txt,X,Y)}
    else{ctx.beginPath();ctx.arc(X,Y,R,0,6.28);ctx.fill()}
    ctx.globalCompositeOperation='source-over'}
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,255,255,.75)';for(const f of snow){ctx.beginPath();ctx.arc(f.x*T,f.y*T,f.r*T,0,6.28);ctx.fill()}
  ctx.drawImage(vignette,0,0,W,H);
  if(S.maxWave>1){for(let w=1;w<=S.maxWave;w++){ctx.fillStyle=w<S.wave?'#ffd34d':w===S.wave?'#ffffff':'rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(T*.55+(w-1)*T*.42,T*.5,T*.13,0,6.28);ctx.fill()}}
  if(S.flash>0){ctx.fillStyle='rgba(255,255,255,'+S.flash*.35+')';ctx.fillRect(0,0,W,H)}
  if(S.combo>1&&now-S.lastEat<1400&&S.state==='play'){const k=1-(now-S.lastEat)/1400;ctx.fillStyle='rgba(10,20,48,.55)';rr(ctx,W-T*3.2,T*.3,T*2.9,T*.42,T*.2);ctx.fill();
    ctx.fillStyle='#ffd34d';rr(ctx,W-T*3.2,T*.3,T*2.9*k,T*.42,T*.2);ctx.fill();ctx.font=Math.round(T*.34)+'px "Lilita One",sans-serif';ctx.textAlign='center';ctx.fillStyle='#132558';ctx.fillText('COMBO x'+S.combo,W-T*1.75,T*.63)}
  if(S.doorOpen&&S.state==='play'){ctx.font=Math.round(T*.42)+'px "Lilita One",sans-serif';ctx.textAlign='center';ctx.lineWidth=T*.12;ctx.lineJoin='round';ctx.strokeStyle='rgba(10,20,48,.75)';
    const msg='¡Puerta abierta! Corre a la salida';ctx.strokeText(msg,W/2,H-T*.25);ctx.fillStyle='#ffd34d';ctx.fillText(msg,W/2,H-T*.25)}
  ctx.restore();
  if(S.state==='intro'){const n=Math.max(1,Math.ceil(S.introT/800)),fr=((S.introT%800)+800)%800/800,sc=1+fr*.6;
    ctx.fillStyle='rgba(10,20,48,'+(.25*Math.min(1,Math.max(0,S.introT)/400))+')';ctx.fillRect(0,0,W,H);
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(sc,sc);ctx.globalAlpha=Math.min(1,fr*2.2);ctx.font=Math.round(T*2.4)+'px "Lilita One",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=T*.3;ctx.lineJoin='round';ctx.strokeStyle='#1b4f90';ctx.strokeText(n,0,0);ctx.fillStyle='#ffffff';ctx.fillText(n,0,0);ctx.restore();
    ctx.font=Math.round(T*.55)+'px "Lilita One",sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.lineWidth=T*.14;ctx.strokeStyle='#1b4f90';const nm='Nivel '+(S.li+1)+' · '+S.L.name;ctx.strokeText(nm,W/2,H/2+T*2);ctx.fillStyle='#ffffff';ctx.fillText(nm,W/2,H/2+T*2)}
  if(S.state==='exit'){const a=Math.min(1,(now-S.exitT-500)/400);if(a>0){
    ctx.fillStyle='rgba(10,20,48,'+(.55*a)+')';ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=Math.round(T*1.1)+'px "Lilita One",sans-serif';ctx.lineWidth=T*.2;ctx.lineJoin='round';ctx.strokeStyle='#1b4f90';ctx.strokeText('¡Nivel superado!',W/2,H/2-T*1.6);ctx.fillStyle='#fff';ctx.fillText('¡Nivel superado!',W/2,H/2-T*1.6);
    for(let i=0;i<3;i++){const sa=Math.min(1,Math.max(0,(now-S.exitT-800-i*180)/250)),x=W/2+(i-1)*T*1.4;ctx.save();ctx.translate(x,H/2);ctx.scale(sa*(1+.3*Math.sin(sa*Math.PI)),sa*(1+.3*Math.sin(sa*Math.PI)));
      ctx.font=Math.round(T*1.3)+'px sans-serif';ctx.fillStyle=i<S.stars?'#ffd34d':'#3c5596';ctx.fillText('★',0,0);ctx.restore()}
    ctx.font=Math.round(T*.5)+'px "Lilita One",sans-serif';ctx.fillStyle='#cfe8ff';ctx.fillText('Puntos '+S.score+' · Tiempo '+fmt(S.time),W/2,H/2+T*1.3);
    ctx.fillStyle='#9fe8ff';ctx.fillText(S.li>=LEVELS.length-1?'Último nivel…':'Siguiente nivel…',W/2,H/2+T*2.1);ctx.restore()}}
  if(NET.mode==='guest'&&S.live&&NET.lastSnapT&&now-NET.lastSnapT>2500&&S.state!=='lost'&&S.state!=='done'){
    const msg='Esperando al anfitrión…';ctx.font=Math.round(T*.42)+'px "IBM Plex Mono",monospace';const w=ctx.measureText(msg).width+T*.8;
    ctx.fillStyle='rgba(20,20,20,.85)';ctx.fillRect(W/2-w/2,T*.9,w,T*.75);ctx.fillStyle='#ff4f7b';ctx.fillRect(W/2-w/2,T*.9,T*.12,T*.75);
    ctx.fillStyle='#eeeae0';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(msg,W/2+T*.06,T*1.28);ctx.textBaseline='alphabetic'}

function renderHero(){
  if(!menuHero||!menuHero.isConnected)return;
  const d=Math.min(2,window.devicePixelRatio||1),w=menuHero.clientWidth,h=menuHero.clientHeight;if(!w||!h)return;
  if(menuHero.width!==Math.round(w*d)||menuHero.height!==Math.round(h*d)){menuHero.width=Math.round(w*d);menuHero.height=Math.round(h*d)}
  const c=menuHero.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h);
  heroTilt.sx+=(heroTilt.x-heroTilt.sx)*.08;heroTilt.sy+=(heroTilt.y-heroTilt.sy)*.08;
  const s=Math.min(w*.62,h*.86),bx=w/2,by=h/2+s*.04;
  const g=c.createRadialGradient(bx,by,0,bx,by,s*.9);g.addColorStop(0,'rgba(159,232,255,.30)');g.addColorStop(1,'rgba(159,232,255,0)');c.fillStyle=g;c.fillRect(0,0,w,h);
  c.save();c.translate(bx,by+s*.36);c.scale(1,.26);c.strokeStyle='rgba(159,232,255,.45)';c.lineWidth=2;c.beginPath();c.arc(0,0,s*.42,0,6.29);c.stroke();
  c.rotate(now*.0005);c.setLineDash([3,9]);c.strokeStyle='rgba(255,79,123,.6)';c.beginPath();c.arc(0,0,s*.6,0,6.29);c.stroke();c.restore();
  c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(bx,by+s*.36,s*.2,s*.045,0,0,6.29);c.fill();
  const a=Math.min(1,(now-heroSwap)/420),e=1-Math.pow(1-a,3),faces=['down','right','down','left'],ph=Math.floor(now/1600)%4;
  c.save();c.globalAlpha=e;
  drawChar(c,save.char,bx+heroTilt.sx*18+(1-e)*heroDir*s*.6,by+heroTilt.sy*10,s*(.85+.15*e),{face:faces[ph],tm:now,squash:Math.max(0,Math.sin(now*.004))*.22+(1-e)*.6,lean:heroTilt.sx*1.4-(1-e)*heroDir,happy:a<1||(ph===2&&now%1600<500)});
  c.restore();
  c.fillStyle='rgba(255,255,255,.75)';
  for(let i=0;i<16;i++){const t=(now*.00004*(1+i%3)+i*.137)%1;c.beginPath();c.arc(hash(i,2)*w+Math.sin(now*.001+i)*6-heroTilt.sx*10*(1+i%2),t*h,.8+hash(i,5)*1.6,0,6.29);c.fill()}
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(t){
  const dt=Math.min(50,t-last);last=t;now=t;
  try{pollPad();update(dt);netTick();render();renderHero();updateMusic()}catch(err){console.error(err)}
  requestAnimationFrame(frame);
}
applySettings();loadLevel(0);S.live=false;showMenu();requestAnimationFrame(frame);
})();
