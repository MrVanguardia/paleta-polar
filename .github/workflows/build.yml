name: Compilación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLETOOL_VERSION: 1.17.2
  BUILD_TOOLS_VERSION: 36.0.0

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar niveles, partidas y red
        run: node tests/test.js

  apk:
    name: APK y AAB
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;$BUILD_TOOLS_VERSION" > /dev/null

      - name: Descargar bundletool
        run: curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"

      - name: Preparar el juego
        run: python3 tools/build-www.py

      - name: Compilar
        env:
          BUNDLETOOL: ${{ runner.temp }}/bundletool.jar
          VERSION_NAME: dev-${{ github.run_number }}
        run: sh native/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PaletaPolar-apk
          path: native/PaletaPolar.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PaletaPolar-aab-sin-firmar
          path: native/PaletaPolar.aab
          if-no-files-found: error
