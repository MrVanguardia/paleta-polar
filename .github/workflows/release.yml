name: Publicar versión

# Se ejecuta al subir una etiqueta vX.Y.Z (por ejemplo v1.5.2).
# Si existen los secretos UPLOAD_KEYSTORE_BASE64 y UPLOAD_KEYSTORE_PASSWORD,
# el AAB sale firmado con la llave de subida y listo para Google Play.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta a publicar (por ejemplo v1.5.2)
        required: true

permissions:
  contents: write

env:
  BUNDLETOOL_VERSION: 1.17.2
  BUILD_TOOLS_VERSION: 36.0.0

jobs:
  publicar:
    name: Compilar y publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Versión
        id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VN="${TAG#v}"
          IFS=. read -r MA MI PA <<EOF
          $VN
          EOF
          PA="${PA%%[!0-9]*}"
          VC=$(( MA * 10000 + MI * 100 + PA ))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "Versión $VN, código $VC"

      - name: ¿Ya está publicada?
        id: existe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh release view "${{ steps.v.outputs.tag }}" --json assets -q '.assets | length' 2>/dev/null || echo none)
          echo "assets=$N" >> "$GITHUB_OUTPUT"
          if [ "$N" != none ] && [ "$N" != 0 ]; then echo "La versión ya tiene archivos; no se tocan."; fi

      - uses: actions/setup-node@v7
        if: steps.existe.outputs.assets == 'none' || steps.existe.outputs.assets == '0'
        with:
          node-version: 20

      - name: Pruebas
        if: steps.existe.outputs.assets == 'none' || steps.existe.outputs.assets == '0'
        run: node tests/test.js

      - uses: actions/setup-java@v4
        if: steps.existe.outputs.assets == 'none' || steps.existe.outputs.assets == '0'
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Android SDK 36
        if: steps.existe.outputs.assets == 'none' || steps.existe.outputs.assets == '0'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;$BUILD_TOOLS_VERSION" > /dev/null

      - name: Descargar bundletool
        if: steps.existe.outputs.assets == 'none' || steps.existe.outputs.assets == '0'
        run: curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"

      - name: Preparar llave de subida
        if: steps.existe.outputs.assets == 'none' || steps.existe.outputs.assets == '0'
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Llave de subida lista."
          else
            echo "::warning::Sin el secreto UPLOAD_KEYSTORE_BASE64 el AAB se publica sin firmar."
          fi

      - name: Compilar
        if: steps.existe.outputs.assets == 'none' || steps.existe.outputs.assets == '0'
        env:
          BUNDLETOOL: ${{ runner.temp }}/bundletool.jar
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          python3 tools/build-www.py
          sh native/build-apk.sh
          mkdir -p dist
          cp native/PaletaPolar.apk dist/PaletaPolar.apk
          if [ -n "$KEYSTORE" ]; then cp native/PaletaPolar.aab dist/PaletaPolar.aab
          else cp native/PaletaPolar.aab dist/PaletaPolar-sin-firmar.aab; fi
          (cd dist && sha256sum * > SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Notas de la versión
        if: steps.existe.outputs.assets == 'none' || steps.existe.outputs.assets == '0'
        run: |
          awk -v v="${{ steps.v.outputs.name }}" '
            index($0, "## [" v "]") == 1 {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notas.md
          [ -s notas.md ] || echo "Versión ${{ steps.v.outputs.name }}." > notas.md
          printf '\n---\n**Instalar:** descarga `PaletaPolar.apk` en tu Android. El `.aab` es para Google Play.\n' >> notas.md

      - name: Publicar en Releases
        if: steps.existe.outputs.assets == 'none' || steps.existe.outputs.assets == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="${{ steps.v.outputs.tag }}"
          if [ "${{ steps.existe.outputs.assets }}" = none ]; then
            gh release create "$T" dist/* --title "Paleta Polar ${{ steps.v.outputs.name }}" --notes-file notas.md --verify-tag
          else
            gh release upload "$T" dist/*
          fi
