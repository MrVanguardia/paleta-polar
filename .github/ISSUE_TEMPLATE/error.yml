name: 🐞 Reportar un error
description: Algo no funciona como debería
labels: [error]
body:
  - type: markdown
    attributes:
      value: Gracias por avisar. Cuantos más detalles, más rápido se arregla.
  - type: textarea
    id: que
    attributes:
      label: ¿Qué pasó?
      description: Lo que viste y lo que esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para que ocurra
      placeholder: |
        1. Abrir Multijugador → Crear sala
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión del juego
      placeholder: "1.5.1"
    validations:
      required: true
  - type: input
    id: telefono
    attributes:
      label: Teléfono y versión de Android
      placeholder: "Samsung Galaxy A54, Android 15"
    validations:
      required: true
  - type: dropdown
    id: modo
    attributes:
      label: Modo
      multiple: true
      options: [Un jugador, Multijugador (anfitrión), Multijugador (invitado)]
  - type: dropdown
    id: control
    attributes:
      label: Control
      multiple: true
      options: [Joystick, Deslizar, Cruceta, Mando]
  - type: textarea
    id: extra
    attributes:
      label: Capturas o video
      description: Arrastra aquí imágenes o videos si los tienes.
